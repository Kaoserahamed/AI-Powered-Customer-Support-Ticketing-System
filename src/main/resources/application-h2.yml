spring:
  application:
    name: ai-ticketing-system
  
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  
  datasource:
    url: jdbc:h2:mem:ticketing_db
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

google:
  ai:
    api-key: AIzaSyDYlonF2VhmiuWy_mjtZ4VhnjbQRZntFDg

server:
  port: 8080

logging:
  level:
    com.support: DEBUG
    org.springframework.ai: DEBUG
