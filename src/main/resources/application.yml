spring:
  application:
    name: ai-ticketing-system
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing_db
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
  
  ai:
    vertex:
      ai:
        gemini:
          api-key: ${GOOGLE_AI_KEY:AIzaSyDYlonF2VhmiuWy_mjtZ4VhnjbQRZntFDg}
          chat:
            options:
              model: gemini-pro
              temperature: 0.7

server:
  port: 8080

logging:
  level:
    com.support: DEBUG
    org.springframework.ai: DEBUG
